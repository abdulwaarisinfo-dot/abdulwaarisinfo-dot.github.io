<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muhammad Waris — AI Backend Engineer</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0A0E10; --text:#EDEEF0; --muted:#7C8890; --accent:#3FE0C5; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  .logo{
    font-family:'JetBrains Mono',monospace; font-weight:800; font-size:22px;
    margin-bottom:32px; letter-spacing:-0.5px;
  }
  .logo .cursor{ color:var(--accent); animation:blink 1.1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  h1{
    font-family:'JetBrains Mono',monospace; font-weight:800; font-size:clamp(28px,5vw,44px);
    line-height:1.3; letter-spacing:-1px; max-width:720px; margin-bottom:16px;
  }
  h1 .hl{ color:var(--accent); }
  p.sub{ color:var(--muted); font-size:15px; max-width:480px; margin-bottom:40px; }
  .status{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted);
    display:flex; align-items:center; gap:8px; letter-spacing:0.5px; text-transform:uppercase;
  }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); animation:blink 1.6s steps(1) infinite; }
</style>
</head>
<body>
  <div class="logo">MW<span class="cursor">_</span></div>
  <h1>I build <span class="hl">production-ready AI backend systems</span> — not demos.</h1>
  <p class="sub">Muhammad Waris — Backend AI Engineer. Full site incoming.</p>
  <div class="status"><span class="dot"></span> Building in public — check back soon</div>
</body>
</html>
